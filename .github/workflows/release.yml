name: Publicar NEXORA

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: NEXORA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: NEXORA/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Usar la versión de la etiqueta
        shell: pwsh
        run: npm version $env:GITHUB_REF_NAME.TrimStart('v') --no-git-tag-version --allow-same-version
      - name: Pruebas
        run: npm test
      - name: Compilar instalador
        run: npm run desktop:dist -- --publish never
      - name: Publicar archivos verificados
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $setup = "electron-release/NEXORA_${version}_x64-setup.exe"
          $blockmap = "${setup}.blockmap"
          $metadata = "electron-release/latest.yml"
          foreach ($file in @($setup, $blockmap, $metadata)) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Falta el artefacto requerido: $file" }
          }
          gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --title $version --generate-notes
          gh release upload $env:GITHUB_REF_NAME $setup $blockmap $metadata --repo $env:GITHUB_REPOSITORY --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

